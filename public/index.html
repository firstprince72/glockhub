<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glockhub Store | Watches, Jewelry, Earbuds and Speakers in Lagos, Nigeria</title>
<meta name="description" content="Shop Glockhub Store for wristwatches, jewelry sets, wireless earbuds and Bluetooth speakers. Pay by bank transfer, Moniepoint or card. Delivery in Lagos, Nigeria.">
<meta name="theme-color" content="#fe0000">
<meta property="og:title" content="Glockhub Store">
<meta property="og:description" content="Watches, jewelry, earbuds and speakers delivered to your door.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#fe0000;--ink:#1a1210;--mut:#6d625d;--bg:#fff;--sf:#fff4ee;--ln:#eadfd8;--or:#f7943a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f6ece7;--mut:#b3a59e;--bg:#161110;--sf:#241a18;--ln:#3a2c28;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f6ece7;--mut:#b3a59e;--bg:#161110;--sf:#241a18;--ln:#3a2c28;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--red);display:flex;gap:12px;align-items:center;padding:10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.logo{height:46px;background:#fff;border-radius:8px;padding:2px 6px}
.search{flex:1;min-width:0;border:2px solid var(--ln);background:var(--sf);border-radius:999px;padding:9px 16px}
.ib{position:relative;background:var(--sf);border:2px solid var(--ln);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.ib b{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;margin-left:4px;font-size:13px}
.hero{background:var(--red);color:#fff;padding:36px 16px;text-align:left}
.hero div{max-width:1100px;margin:auto}
.hero h1{font-size:clamp(30px,6vw,56px);line-height:1.05;margin:0 0 10px;font-weight:800;max-width:14ch}
.hero p{margin:0 0 16px;max-width:46ch;opacity:.95}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:800}
.hero .btn{background:#fff;color:var(--red)}
.btn.alt{background:var(--sf);color:var(--ink);border:2px solid var(--ln)}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:2px solid var(--ln);background:var(--bg);border-radius:999px;padding:6px 14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
select{border:2px solid var(--ln);background:var(--sf);border-radius:10px;padding:7px 10px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{position:relative;border:2px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.pic img,.big img,.row .e img{width:100%;height:100%;object-fit:cover;display:block}.pic{aspect-ratio:1;overflow:hidden;padding:0;display:grid;place-items:center;font-size:64px;background:var(--sf);position:relative;border:0;width:100%}
.heart{position:absolute;top:8px;right:8px;background:var(--bg);border:2px solid var(--ln);border-radius:50%;width:38px;height:38px;font-size:18px;line-height:1;color:var(--mut)}
.heart[aria-pressed=true]{color:var(--red);border-color:var(--red)}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:16px;cursor:pointer}.cat{color:var(--mut);font-size:13px}
.price{font-weight:800;font-size:18px}.old{color:var(--mut);text-decoration:line-through;font-weight:400;font-size:14px;margin-left:6px}
.tag{color:var(--red);font-weight:800;font-size:13px}
.info .btn{margin-top:auto}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:41;display:none;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.dr.on{display:flex}.dr h2{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ln);padding:10px 0}
.row .e{overflow:hidden;font-size:34px;background:var(--sf);border-radius:10px;width:54px;height:54px;display:grid;place-items:center}
.row .t{flex:1;min-width:0}.q{display:flex;align-items:center;gap:6px}
.q button{width:30px;height:30px;border-radius:8px;border:2px solid var(--ln);background:var(--sf);font-weight:800}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0}
label{display:block;font-weight:600;font-size:14px;margin-top:10px}
.f{width:100%;border:2px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 12px;margin-top:4px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:16px;padding:20px;z-index:41;display:none}.modal.on{display:block}
.big{overflow:hidden;text-align:center;background:var(--sf);border-radius:12px;margin-bottom:10px}
.box{background:var(--sf);border:2px dashed var(--red);border-radius:12px;padding:12px;margin:8px 0;font-size:18px}.th{display:flex;gap:6px;margin-bottom:10px}.th img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid var(--ln);cursor:pointer}.cols{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--ln);margin-right:6px;vertical-align:-1px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-weight:600;display:none}
footer{text-align:center;color:var(--mut);padding:24px 16px;border-top:1px solid var(--ln);font-size:14px}
@media(max-width:560px){.logo{height:36px}.ib span{display:none}}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
</style></head><body>

<div class="grid" id="grid"><p class="empty" role="status" style="grid-column:1/-1">Loading products…</p></div>
</main>
<footer>© 2026 Glockhub Store · Pay by bank transfer, Moniepoint or card · <a href="/admin/" style="color:inherit">Admin</a></footer>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr" aria-label="Cart"></aside>
<div class="modal" id="md" role="dialog" aria-modal="true"></div>
<div class="toast" id="ts"></div>
<script>
var $=function(i){return document.getElementById(i)};
var P=[],catalogReady=false;
if(new URLSearchParams(location.hash.slice(1)).has("invite_token"))location.replace("/admin/"+location.hash);
function G(i){return P.find(function(p){return p.id==i})}
var cat="All",cart={},wish={};
try{cart=JSON.parse(localStorage.getItem("gh_cart")||"{}");wish=JSON.parse(localStorage.getItem("gh_wish")||"{}")}catch(e){}
function save(){try{localStorage.setItem("gh_cart",JSON.stringify(cart));localStorage.setItem("gh_wish",JSON.stringify(wish))}catch(e){}}
function IM(i,n){var p=G(i);return'<img src="'+esc(p&&p.imgs[0]||"")+'" alt="'+esc(n)+'">'}
function m(n){return"₦"+n.toLocaleString("en-NG")}
function toast(t){var x=$("ts");x.textContent=t;x.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){x.style.display="none"},1800)}
function cardH(p){var d=p.o?Math.round((1-p.p/p.o)*100):0;
return'<div class="card"><button class="pic" onclick="view('+p.id+')" aria-label="View '+esc(p.n)+'">'+IM(p.id,p.n)+'</button><button class="heart" aria-pressed="'+!!wish[p.id]+'" aria-label="Save '+esc(p.n)+'" onclick="fav('+p.id+')"></button><div class="info"><span class="cat">'+esc(p.c)+((p.cols||[]).length?' · '+p.cols.length+' colours':'')+'</span><h3 onclick="view('+p.id+')">'+esc(p.n)+'</h3><div><span class="price">'+m(p.p)+'</span>'+(p.o?'<span class="old">'+m(p.o)+'</span>':'')+'</div>'+(d?'<span class="tag">'+d+'% off</span>':'')+'<button class="btn" onclick="qa('+p.id+')">Add to cart</button></div></div>'}
function render(){if(!catalogReady)return;Object.keys(cart).forEach(function(k){var parts=k.split("|"),p=G(parts[0]),colours=p&&p.cols||[];if(!p||(colours.length?!colours.includes(parts[1]):parts[1]))delete cart[k]});Object.keys(wish).forEach(function(i){if(!G(i))delete wish[i]});var q=$("q").value.toLowerCase().trim(),s=$("sort").value;
var l=P.filter(function(p){return(cat=="All"||p.c==cat||(cat=="Saved"&&wish[p.id]))&&(!q||(p.n+p.c).toLowerCase().indexOf(q)>-1)});
if(s=="l")l.sort(function(a,b){return a.p-b.p});if(s=="h")l.sort(function(a,b){return b.p-a.p});
$("count").textContent=l.length+" products";
$("grid").innerHTML=l.length?l.map(cardH).join(""):'<p class="empty" style="grid-column:1/-1">No products match. Try another search or category.</p>';
var cs=["All"].concat(P.map(function(p){return p.c}).filter(function(v,i,a){return a.indexOf(v)==i}));
$("cats").innerHTML=cs.map(function(c){return'<button class="chip" aria-pressed="'+(c==cat)+'" data-category="'+esc(c)+'" onclick="setCat(this.dataset.category)">'+esc(c)+'</button>'}).join("");
$("cc").textContent=Object.values(cart).reduce(function(a,b){return a+b},0);$("wc").textContent=Object.keys(wish).length}
function setCat(c){cat=c;render()}
var SEL="",CK=[];
function dot(c){var v=c.replace(/ /g,"");return /^[a-z]+$/i.test(v)&&window.CSS&&CSS.supports("color",v)?'<i class="dot" style="background:'+v+'"></i>':""}
function qa(i){var p=G(i);if(p.cols&&p.cols.length)view(i);else add(i)}
function pick(b,c){SEL=c;[].forEach.call(b.parentNode.children,function(x){x.setAttribute("aria-pressed",x==b)})}
function addSel(i){var p=G(i);if(p.cols&&p.cols.length&&!SEL){$("ce").textContent="Choose a colour first.";return}add(i,1,SEL);closeAll()}
function add(i,n,c){var k=i+(c?"|"+c:"");cart[k]=(cart[k]||0)+(n||1);save();render();toast(G(i).n+" added to cart")}
function fav(i){wish[i]?delete wish[i]:wish[i]=1;save();render()}
function total(){return Object.keys(cart).reduce(function(a,k){return a+G(k.split("|")[0]).p*cart[k]},0)}
function open(el){$("ov").className="ov on";el.className=el.className.split(" ")[0]+" on"}
function closeAll(){$("ov").className="ov";$("dr").className="dr";$("md").className="modal"}
function view(i){var p=G(i);SEL="";$("md").innerHTML='<div class="big">'+IM(i,p.n)+'</div>'+((p.imgs||[]).length>1?'<div class="th">'+p.imgs.map(function(x){return'<img src="'+esc(x)+'" alt="" onclick="document.querySelector(\'.big img\').src=this.src">'}).join('')+'</div>':'')+'<span class="cat">'+esc(p.c)+'</span><h2 style="margin:4px 0">'+esc(p.n)+'</h2><p style="color:var(--mut)">'+(p.d?esc(p.d):i<15?'Stainless steel build, tested before dispatch.':'')+' Delivered in 1 to 3 working days within Lagos.</p>'+((p.cols||[]).length?'<b>Colour</b><div class="cols" role="group" aria-label="Colour">'+p.cols.map(function(c){return'<button class="chip" aria-pressed="false" data-colour="'+esc(c)+'" onclick="pick(this,this.dataset.colour)">'+dot(c)+esc(c)+'</button>'}).join('')+'</div><p id="ce" style="color:var(--red);font-weight:600;margin:0"></p>':'')+'<div class="price">'+m(p.p)+(p.o?'<span class="old">'+m(p.o)+'</span>':'')+'</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="addSel('+i+')">Add to cart</button><button class="btn alt" onclick="closeAll()">Close</button></div>';open($("md"))}
function cartV(){var k=CK=Object.keys(cart),h='<h2>Your cart <button class="btn alt" onclick="closeAll()" aria-label="Close cart">✕</button></h2>';
if(!k.length)h+='<p class="empty">Your cart is empty. Add something you like.</p>';
else{h+=k.map(function(key,x){var i=key.split("|")[0],c=key.split("|")[1]||"",p=G(i);return'<div class="row"><div class="e">'+IM(i,p.n)+'</div><div class="t"><b>'+esc(p.n)+'</b>'+(c?' <span class="cat">('+esc(c)+')</span>':'')+'<br>'+m(p.p)+'</div><div class="q"><button onclick="qty('+x+',-1)" aria-label="Decrease">−</button><b>'+cart[key]+'</b><button onclick="qty('+x+',1)" aria-label="Increase">+</button></div></div>'}).join("");
var t=total(),dl=t>=50000?0:2500;h+='<div class="tot" style="font-weight:400"><span>Subtotal</span><span>'+m(t)+'</span></div><div class="tot" style="font-weight:400;margin:0"><span>Delivery</span><span>'+(dl?m(dl):"Free")+'</span></div><div class="tot"><span>Total</span><span>'+m(t+dl)+'</span></div><button class="btn" onclick="checkout()">Checkout</button>'}
$("dr").innerHTML=h;open($("dr"))}
function qty(n,d){var i=CK[n];cart[i]+=d;if(cart[i]<1)delete cart[i];save();render();cartV()}
function checkout(){var t=total(),dl=t>=50000?0:2500;$("dr").innerHTML='<h2>Checkout <button class="btn alt" onclick="cartV()" aria-label="Back to cart">←</button></h2><label>Full name<input class="f" id="fn" autocomplete="name"></label><label>Phone<input class="f" id="fp" type="tel" autocomplete="tel"></label><label>Delivery address<input class="f" id="fa" autocomplete="street-address"></label><label>Payment<select class="f" id="fm" style="margin-left:0"><option value="bank">Bank transfer (Sterling Bank)</option><option value="mp">Moniepoint transfer</option><option value="card">Debit or credit card (Mastercard, Verve, Visa)</option></select></label><p id="er" style="color:var(--red);font-weight:600;margin:8px 0 0"></p><div class="tot"><span>Total</span><span>'+m(t+dl)+'</span></div><button class="btn" onclick="place('+(t+dl)+')">Place order</button>'}
var CFG={acct:"0091499005",bank:"Sterling Bank",name:"Goodluck Joseph",mp:"8132217107",wa:"2348132217107",card:""};
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})}
function lo(){try{return JSON.parse(localStorage.getItem("gh_orders")||"[]")}catch(e){return[]}}
function place(t){var n=$("fn").value.trim(),ph=$("fp").value.trim(),ad=$("fa").value.trim();
if(!n||!ph||!ad){$("er").textContent="Enter your name, phone number and delivery address.";return}
var o={id:"GH-"+Math.floor(100000+Math.random()*900000),name:n,phone:ph,addr:ad,pay:$("fm").value,total:t,status:"Awaiting payment",at:Date.now(),items:Object.keys(cart).map(function(k){var i=k.split("|")[0],c=k.split("|")[1]||"";return{n:G(i).n+(c?" ("+c+")":""),q:cart[k],p:G(i).p}})};
var l=lo();l.unshift(o);try{localStorage.setItem("gh_orders",JSON.stringify(l.slice(0,50)))}catch(e){}
cart={};save();render();done(o)}
function pinfo(o){var p=o.pay,w=m(o.total);
if(p=="bank")return'<p>Transfer <b>'+w+'</b> to:</p><div class="box"><b>'+CFG.acct+'</b><br>'+CFG.bank+'<br>'+CFG.name+'<br><small>Use '+o.id+' as the reference.</small></div><button class="btn alt" onclick="cp(\''+CFG.acct+'\')">Copy account number</button>';
if(p=="mp")return'<p>Send <b>'+w+'</b> to:</p><div class="box"><b>'+CFG.mp+'</b><br>Moniepoint<br>'+CFG.name+'<br><small>Use '+o.id+' as the reference.</small></div><button class="btn alt" onclick="cp(\''+CFG.mp+'\')">Copy account number</button>';
return CFG.card?'<p>Pay <b>'+w+'</b> securely by debit or credit card.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+CFG.card+'">Pay with card</a>':'<p>Card payment for <b>'+w+'</b>: we will send a secure card payment link to your phone on WhatsApp. Debit and credit cards (Mastercard, Verve, Visa) are accepted.</p>'}
function wa(o){var t="Hello Glockhub Store, I placed order "+o.id+" ("+o.items.map(function(i){return i.q+"x "+i.n}).join(", ")+") total "+m(o.total)+". Payment: "+({bank:"Bank transfer",mp:"Moniepoint",card:"Card"})[o.pay]+". Name: "+o.name+", Address: "+o.addr;return"https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(t)}
function cp(x){try{navigator.clipboard.writeText(x);toast("Copied "+x)}catch(e){toast(x)}}
function done(o){$("dr").innerHTML='<h2>Order '+o.id+' <button class="btn alt" onclick="closeAll()" aria-label="Close">✕</button></h2><p>Thank you, '+esc(o.name)+'. Complete your payment so we can ship your order.</p>'+pinfo(o)+'<p>After paying, send your receipt:</p><a class="btn" style="display:block;text-align:center;text-decoration:none;background:#1faa59" target="_blank" rel="noopener" href="'+wa(o)+'">Send order on WhatsApp</a>';open($("dr"))}
function myOrders(){var l=lo(),h='<h2>My orders <button class="btn alt" onclick="closeAll()" aria-label="Close">✕</button></h2>';
h+=l.length?l.map(function(o,i){return'<div class="row" style="display:block"><b>'+o.id+'</b> · '+m(o.total)+'<br><span class="cat">'+new Date(o.at).toLocaleString()+' · '+o.status+'</span><br><button class="btn alt" style="margin-top:6px" onclick="done(lo()['+i+'])">Payment details</button></div>'}).join(""):'<p class="empty">No orders yet on this device.</p>';
$("dr").innerHTML=h;open($("dr"))}
$("cb").onclick=cartV;$("mo").onclick=myOrders;$("ov").onclick=closeAll;$("q").oninput=render;$("sort").onchange=render;
$("wb").onclick=function(){cat=cat=="Saved"?"All":"Saved";render();$("shop").scrollIntoView({behavior:"smooth"})};
document.onkeydown=function(e){if(e.key=="Escape")closeAll()};
async function loadCatalog(){try{var response=await fetch("/api/catalog/products");if(!response.ok)throw new Error();P=await response.json();catalogReady=true;$("cb").disabled=false;render();save()}catch(e){$("grid").innerHTML='<p class="empty" style="grid-column:1/-1">Products are temporarily unavailable. <button class="btn alt" onclick="this.disabled=true;loadCatalog()">Try again</button></p>'}}
window.addEventListener("pageshow",function(event){if(event.persisted){closeAll();loadCatalog()}});
loadCatalog();
</script></body></html>
